; Mounted into the dev container at /usr/local/etc/php/conf.d/php.dev.ini
; (see docker-compose.yml). Without this file Docker creates a directory at this
; path and PHP falls back to its built-in defaults of 2M/8M, which silently drops
; any real document upload.

; Largest single uploaded file. Keep in sync with FILE_SIZE_MB in
; frontend/src/utils/constants/upload.ts (the client-side check) and with the
; maxSize constraint in src/Controller/Admin/DocumentBulkUploadController.php.
upload_max_filesize = 200M

; Caps the entire multipart body, which carries the name/course/category/tags
; fields alongside the file, so it has to exceed upload_max_filesize. Same +5M
; headroom as serverActions.bodySizeLimit in frontend/next.config.ts.
post_max_size = 205M

; Time allowed for receiving and parsing the request body. In production nginx
; buffers the upload before PHP-FPM sees it, but the dev server reads it straight
; off the socket, so a slow upload is charged to PHP here.
max_input_time = 300
