# Document storage.
#
# DOCUMENT_STORAGE picks where uploaded documents live, at runtime:
#   local -> backend/data/documents (the default in dev and test)
#   s3    -> an S3-compatible bucket: Hetzner Object Storage in production, the
#            SeaweedFS container from docker-compose.yml in local development.
#
# Nothing below is Hetzner-specific: moving to another S3-compatible store (for
# example a self-hosted bucket) only means changing the S3_* variables.
#
# S3_ENDPOINT is how the backend reaches the bucket; S3_PUBLIC_ENDPOINT is the
# host browsers are redirected to for downloads (pre-signed URLs are signed for
# that host). They differ when the bucket sits on an internal network, as the
# SeaweedFS container does locally (http://s3:8333 vs http://localhost:8333).

parameters:
    env(DOCUMENT_STORAGE): 'local'
    env(S3_ENDPOINT): 'http://localhost:8333'
    env(S3_PUBLIC_ENDPOINT): '%env(S3_ENDPOINT)%'
    env(S3_REGION): 'us-east-1'
    env(S3_BUCKET): ''
    env(S3_ACCESS_KEY): ''
    env(S3_SECRET_KEY): ''

flysystem:
    storages:
        # Uploaded documents.
        documents.local:
            local:
                directory: '%kernel.project_dir%/data/documents'

        documents.s3:
            aws:
                client: 's3_client'
                bucket: '%env(S3_BUCKET)%'
                prefix: 'documents'

        # The storage VichUploader writes to; resolved per request from DOCUMENT_STORAGE.
        default.storage:
            lazy:
                source: 'documents.%env(DOCUMENT_STORAGE)%'

        # Generated zip downloads: a cache that app:delete-old-zips prunes, kept next to
        # the documents so they can be handed out through the same kind of signed link.
        exports.local:
            local:
                directory: '%kernel.project_dir%/data/exports'

        exports.s3:
            aws:
                client: 's3_client'
                bucket: '%env(S3_BUCKET)%'
                prefix: 'exports'

        exports.storage:
            lazy:
                source: 'exports.%env(DOCUMENT_STORAGE)%'

services:
    s3_client:
        class: Aws\S3\S3Client
        arguments:
            -
                version: 'latest'
                region: '%env(S3_REGION)%'
                endpoint: '%env(S3_ENDPOINT)%'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(S3_ACCESS_KEY)%'
                    secret: '%env(S3_SECRET_KEY)%'

    # Only used to sign download URLs (see App\Service\PresignedUrlGenerator),
    # so it must use the host browsers can reach. Lazy: with local storage it is
    # injected on every download but never used, so it is never built either.
    s3_public_client:
        class: Aws\S3\S3Client
        lazy: true
        arguments:
            -
                version: 'latest'
                region: '%env(S3_REGION)%'
                endpoint: '%env(S3_PUBLIC_ENDPOINT)%'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(S3_ACCESS_KEY)%'
                    secret: '%env(S3_SECRET_KEY)%'

when@prod:
    parameters:
        # Production has always stored documents on S3; keep that the default.
        env(DOCUMENT_STORAGE): 's3'
