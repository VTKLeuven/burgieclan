nelmio_security:
    # prevents framing of the entire site
    clickjacking:
        paths:
            '^/admin/document-preview/.*': ALLOW
            '^/.*': DENY

    # disables content type sniffing for script resources
    content_type:
        nosniff: true

    # Send a full URL in the `Referer` header when performing a same-origin request,
    # only send the origin of the document to secure destination (HTTPS->HTTPS),
    # and send no header to a less secure destination (HTTPS->HTTP).
    # If `strict-origin-when-cross-origin` is not supported, use `no-referrer` policy,
    # no referrer information is sent along with requests.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Content Security Policy (CSP) - mitigate XSS attacks
    csp:
        enforce:
            level1_fallback: true
            default-src:
                - 'self'
                - 'unsafe-inline'
            script-src:
                - 'self'
                - 'unsafe-inline'
                - 'https://cdnjs.cloudflare.com'
            # googleapis serves the @font-face stylesheet; the font files themselves
            # come from gstatic (see font-src).
            #
            # 'unsafe-inline' only covers pages that do NOT request a style nonce.
            # EasyAdmin's _css_assets.html.twig calls csp_nonce('style'), which makes
            # nelmio emit a nonce on this directive — and a nonce voids 'unsafe-inline'
            # for that response. So on /admin, inline style="" attributes are dropped
            # and styling has to go in a <style nonce="..."> block; elsewhere (the Twig
            # login page) inline styles still work. See admin/document_pending_edit.html.twig.
            style-src:
                - 'self'
                - 'unsafe-inline'
                - 'https://fonts.googleapis.com'
            worker-src:
                - 'self'
                - 'blob:'
            font-src:
                - 'self'
                - 'https://fonts.gstatic.com'
            img-src: [ 'self', 'data:', 'https://www.gravatar.com' ]

    # Permissions Policy - control access to browser features
    permissions_policy:
        enabled: false

    # Forced HTTPS/SSL with HSTS (HTTP Strict Transport Security)
    forced_ssl:
        enabled: true
        hsts_max_age: 31536000  # 1 year in seconds
        hsts_subdomains: true  # Apply to all subdomains
        hsts_preload: false  # Set to true only if you want to be included in browser HSTS preload lists

when@dev:
    nelmio_security:
        forced_ssl:
            enabled: false
