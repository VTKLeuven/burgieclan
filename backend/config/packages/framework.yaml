# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        name: BUR_PHPSESSID # Custom session name with BUR prefix

    # When using the HTTP Cache, ESI allows to render page fragments separately
    # and with different cache configurations for each fragment
    # https://symfony.com/doc/current/http_cache/esi.html
    esi: true
    fragments: true

    php_errors:
        log: true

    # The 'ide' option turns all of the file paths in an exception page
    # into clickable links that open the given file using your favorite IDE.
    # When 'ide' is set to null the file is opened in your web browser.
    # See https://symfony.com/doc/current/reference/configuration/framework.html#ide
    ide: null

    # Trust all proxies (REMOTE_ADDR makes Symfony trust the direct proxy)
    # This is safe because nginx container network is isolated
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    
    # Trust these headers from the reverse proxy chain.
    # x-forwarded-prefix is omitted so clients cannot spoof a base-path prefix.
    # x-forwarded-host is omitted because .docker/nginx.conf already forwards
    # Host ($http_host) directly (and external proxies like Caddy preserve Host),
    # so trusting X-Forwarded-Host is unnecessary and would allow host spoofing
    # when nginx is reached directly or behind a proxy that passes the header through.
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    property_info:
        with_constructor_extractor: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            name: BUR_TEST_PHPSESSID

when@dev:
    framework:
        session:
            name: BUR_DEV_PHPSESSID
