name: Security

on:
  push:
    branches:
      - main
  pull_request:
  # Started by Auto Audit Fix on its own pull requests, whose pull_request runs wait for approval.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # npm audit cannot ignore an advisory, so high and critical ones are filtered here.
      # Allow only advisories with no patched version yet, and say why each is harmless:
      # - GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3): only reached through eslint-config-next, at
      #   lint time, on our own glob patterns. The fix is micromatch/braces#72.
      - name: Run security audit
        env:
          ALLOWED_ADVISORIES: |
            GHSA-vfj7-8cjw-p6xm
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          if ! jq -e 'has("vulnerabilities")' "$RUNNER_TEMP/audit.json" > /dev/null; then
            cat "$RUNNER_TEMP/audit.json"
            exit 1
          fi

          # Every advisory sits in "via" of the package it affects; its dependents only name it.
          jq -r '[.vulnerabilities[].via[] | objects
                  | select(.severity == "high" or .severity == "critical")
                  | {id: (.url | split("/") | last), name, severity, title}]
                 | unique_by(.id) | .[] | "\(.id)\t\(.severity)\t\(.name)\t\(.title)"' \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/found.tsv"

          failed=0
          while IFS=$'\t' read -r id severity name title; do
            if grep -qxF "$id" <<< "$ALLOWED_ADVISORIES"; then
              echo "Allowed: $id ($severity, $name) $title"
            else
              echo "::error::$id ($severity, $name) $title"
              failed=1
            fi
          done < "$RUNNER_TEMP/found.tsv"

          for id in $ALLOWED_ADVISORIES; do
            grep -q "^$id"$'\t' "$RUNNER_TEMP/found.tsv" \
              || echo "::warning::$id no longer appears in npm audit; remove it from the allowlist."
          done

          exit "$failed"

  composer-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"

      - name: Run security audit
        run: composer audit --locked
