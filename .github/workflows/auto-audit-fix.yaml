name: Auto Audit Fix

on:
  schedule:
    - cron: "30 4 * * *" # Daily at 04:30 UTC
  workflow_dispatch: # Allow manual trigger from GitHub UI
  workflow_run:
    workflows: ["Security"]
    types: [completed]
    branches: [main]

# Only one auto-fix at a time.
concurrency:
  group: auto-audit-fix
  cancel-in-progress: true

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    # Only run after a failed Security workflow, or on schedule/manual trigger.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'

    permissions:
      contents: write
      pull-requests: write
      # To start the checks on the pull request, see the last step.
      actions: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Run npm audit fix
        run: |
          if npm audit --audit-level high; then
            echo "No vulnerabilities to fix."
            echo "has_fix=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Only rewrite the lockfile: installing would run the install scripts of the new
          # versions here, with a token that can push and open pull requests.
          npm audit fix --package-lock-only

          if git diff --quiet package-lock.json; then
            echo "npm audit fix made no changes."
            echo "has_fix=false" >> "$GITHUB_ENV"
          else
            echo "has_fix=true" >> "$GITHUB_ENV"
          fi

      - name: Create Pull Request
        id: create-pr
        if: env.has_fix == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "fix(security): automatic npm audit fix"
          title: "fix(security): automatic npm audit fix"
          body: |
            Automated `npm audit fix` for high/critical severity vulnerabilities
            detected in `frontend/package-lock.json`.

            This PR was created automatically by the **Auto Audit Fix** workflow, which also
            starts the CI and Security checks on it. It merges itself once they pass.
          branch: auto/npm-audit-fix
          labels: dependencies, security
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash

      # Runs that a pull request opened with GITHUB_TOKEN would trigger are held until a
      # maintainer approves them, so the required checks never report and auto-merge waits
      # forever. Starting the workflows by hand is allowed with GITHUB_TOKEN; their results land
      # on the branch's head commit, which is what the required checks look at. Branch protection
      # requires the branch to be up to date with main, and this job rebuilds it from main on
      # every run, so the checks test what would be merged.
      - name: Run the checks on the pull request
        if: >-
          steps.create-pr.outputs.pull-request-operation == 'created' ||
          steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yaml --ref auto/npm-audit-fix
          gh workflow run security-audit.yaml --ref auto/npm-audit-fix
