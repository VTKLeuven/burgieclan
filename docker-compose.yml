services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: burgieclan-db
    volumes:
      - burgieclan-db:/var/lib/postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: burgieclan_db_pass
      POSTGRES_DB: burgieclan_db
      POSTGRES_USER: burgieclan_db_user
    networks:
      - burgieclan-network

  backend:
    container_name: burgieclan-backend
    build:
      context: .
      dockerfile: ./backend/.docker/dev/Dockerfile
    volumes:
      - .:/app
      - backend-vendor:/app/backend/vendor
      - backend-var:/app/backend/var
      - ./backend/php.dev.ini:/usr/local/etc/php/conf.d/php.dev.ini:ro
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://burgieclan_db_user:burgieclan_db_pass@db:5432/burgieclan_db?serverVersion=18&charset=utf8"
      # The VTK website hosts VTK, the authorization server. Locally it runs on 3000,
      # which is why the frontend below moved to 3002.
      FLUXUS_SSO_ISSUER: ${FLUXUS_SSO_ISSUER:-http://localhost:3000/api/auth/better}
      FLUXUS_SSO_CLIENT_ID: ${FLUXUS_SSO_CLIENT_ID:?FLUXUS_SSO_CLIENT_ID is required}
      FLUXUS_SSO_CLIENT_SECRET: ${FLUXUS_SSO_CLIENT_SECRET:?FLUXUS_SSO_CLIENT_SECRET is required}
      FRONTEND_URL: "http://localhost:3002"
      # Shared with the collab service below. A development-only value; production sets its own.
      COLLAB_SECRET: &collab-secret "dev-only-collab-secret-not-for-production-0000"
      # Where uploaded documents live: `local` (backend/data/documents, the default) or
      # `s3` to use the SeaweedFS bucket below, the same code path as production.
      # Switch with `COMPOSE_PROFILES=s3 DOCUMENT_STORAGE=s3 docker compose up -d`, then run
      # `docker compose exec backend php bin/console app:s3:setup-bucket` once.
      DOCUMENT_STORAGE: ${DOCUMENT_STORAGE:-local}
      S3_ENDPOINT: "http://s3:8333"
      # The browser follows download redirects to the bucket, so pre-signed URLs are
      # signed for the host-side address rather than the container name.
      S3_PUBLIC_ENDPOINT: "http://localhost:8333"
      S3_REGION: "us-east-1"
      S3_BUCKET: "burgieclan"
      S3_ACCESS_KEY: "burgieclan"
      S3_SECRET_KEY: "burgieclan-dev-secret"
    networks:
      - burgieclan-network
    # The backend exchanges the code and fetches userinfo server to server, so
    # `localhost` has to reach the host machine (where the VTK site runs), not the
    # container itself.
    extra_hosts:
      - "localhost:host-gateway"

  frontend:
    container_name: burgieclan-frontend
    build:
      context: .
      dockerfile: ./frontend/.docker/dev/Dockerfile
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
      - frontend-next:/app/frontend/.next:delegated
    ports:

      # 3000 on the host belongs to the VTK website in local development; that is
      # where BETTER_AUTH_URL points and what its trusted origins allow.
      #
      # Same port on both sides because the dev script passes `next dev -p 3002`, and that
      # flag wins over PORT - mapping to 3000 pointed at a port nothing listens on.
      - "3002:3002"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3002
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3002
      # The browser opens this websocket itself, so it is the host port, not the service name.
      - NEXT_PUBLIC_COLLAB_URL=ws://localhost:1234
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - backend
    networks:
      - burgieclan-network
    extra_hosts:
      - "localhost:host-gateway"

  # Live collaborative editing (Hocuspocus). Browsers connect to it over a websocket; it loads
  # and stores documents through Symfony's internal routes. See collab/README.md.
  collab:
    container_name: burgieclan-collab
    build:
      context: .
      dockerfile: ./collab/.docker/dev/Dockerfile
    volumes:
      - .:/app
      - collab-node-modules:/app/collab/node_modules
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
      BACKEND_URL: "http://backend:8000"
      COLLAB_SECRET: *collab-secret
    depends_on:
      - backend
    networks:
      - burgieclan-network

  # Local S3-compatible object storage, standing in for the production bucket.
  # Only used when the backend runs with DOCUMENT_STORAGE=s3, so it only starts with the s3 profile.
  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: [ s3 ]
    container_name: burgieclan-s3
    command: >-
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=128 -volume.max=50
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - burgieclan-s3:/data
      - ./.docker/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    networks:
      - burgieclan-network

networks:
  burgieclan-network:
    driver: bridge

volumes:
  burgieclan-db: {}
  burgieclan-s3: {}
  backend-vendor: {}
  backend-var: {}
  frontend-node-modules: {}
  frontend-next: {}
  collab-node-modules: {}
